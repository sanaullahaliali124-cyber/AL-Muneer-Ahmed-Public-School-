<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - AL Muneer Ahmed Public School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="dashboard-body">
    <div class="sidebar-overlay" onclick="App.toggleSidebar()"></div>
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="assets/logo.png" alt="Logo" onerror="this.style.display='none'">
            <div><h2>Student Portal</h2><span>AL Muneer Ahmed Public School</span></div>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="active" onclick="showSSection('dashboard')"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="#" onclick="showSSection('attendance')"><i class="fas fa-calendar-check"></i> My Attendance</a>
            <a href="#" onclick="showSSection('results')"><i class="fas fa-chart-bar"></i> My Results</a>
            <a href="#" onclick="showSSection('homework')"><i class="fas fa-book-open"></i> Homework</a>
            <a href="#" onclick="showSSection('timetable')"><i class="fas fa-clock"></i> Timetable</a>
            <a href="#" onclick="showSSection('notices')"><i class="fas fa-bullhorn"></i> Notices</a>
            <a href="#" onclick="Auth.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info"><div class="avatar">S</div><div><div class="user-name">Student</div><div class="user-role">Student</div></div>
        </div>
    </aside>
    <div class="main-content">
        <div class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" onclick="App.toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1 id="s-title">Student Dashboard</h1>
            </div>
            <div class="topbar-right">
                <button class="topbar-btn" onclick="App.toggleTheme()"><i class="fas fa-moon"></i></button>
            </div>
        </div>
        <div class="content-area">
            <div id="s-dashboard">
                <div class="panel"><div class="panel-header"><h2 id="s-welcome">Welcome</h2></div>
                <div class="panel-body" id="s-profile"></div></div>
            </div>
            <div id="s-attendance" style="display:none;"><div class="panel"><div class="panel-header"><h2>My Attendance</h2></div><div class="panel-body" id="s-att"></div></div></div>
            <div id="s-results" style="display:none;"><div class="panel"><div class="panel-header"><h2>My Results</h2></div><div class="panel-body" id="s-res"></div></div></div>
            <div id="s-homework" style="display:none;"><div class="panel"><div class="panel-header"><h2>Homework</h2></div><div class="panel-body" id="s-hw"></div></div></div>
            <div id="s-timetable" style="display:none;"><div class="panel"><div class="panel-header"><h2>Timetable</h2></div><div class="panel-body" id="s-tt"></div></div></div>
            <div id="s-notices" style="display:none;"><div class="panel"><div class="panel-header"><h2>Notices</h2></div><div class="panel-body" id="s-notices-list"></div></div></div>
        </div>
    </div>
    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/students.js"></script>
    <script src="js/attendance.js"></script>
    <script src="js/results.js"></script>
    <script src="js/homework.js"></script>
    <script src="js/timetable.js"></script>
    <script>
        Auth.protectPage(['student', 'admin']);
        const session = Auth.getSession();
        const studentId = session?.studentId || 'STU_001';
        const student = Students.getStudentById(studentId);

        function showSSection(name) {
            ['dashboard','attendance','results','homework','timetable','notices'].forEach(s => {
                const el = document.getElementById('s-' + s);
                if (el) el.style.display = s === name ? 'block' : 'none';
            });
            document.getElementById('s-title').textContent = name.charAt(0).toUpperCase() + name.slice(1);
            if (name === 'attendance') {
                const att = Attendance.getStudentAttendancePercentage(studentId);
                document.getElementById('s-att').innerHTML = `<div class="stats-grid">
                    <div class="stat-box"><div class="stat-icon green"><i class="fas fa-percentage"></i></div><div class="stat-info"><h3>${att.percentage}%</h3><p>Attendance</p></div></div>
                    <div class="stat-box"><div class="stat-icon blue"><i class="fas fa-check"></i></div><div class="stat-info"><h3>${att.present}</h3><p>Present Days</p></div></div>
                    <div class="stat-box"><div class="stat-icon red"><i class="fas fa-times"></i></div><div class="stat-info"><h3>${att.absent}</h3><p>Absent Days</p></div></div>
                </div>`;
            }
            if (name === 'results') Results.renderResultsTable('s-res', { filters: { studentId } });
            if (name === 'homework') Homework.renderHomeworkList('s-hw', { filters: { className: student?.className } });
            if (name === 'timetable') Timetable.renderTimetable('s-tt', student?.className || 'Class 5', student?.section || 'A');
            if (name === 'notices') {
                document.getElementById('s-notices-list').innerHTML = DB.getRecords(DB.keys.notices).map(n =>
                    `<div style="margin-bottom:15px;"><span class="badge badge-info">${n.category}</span><h3 style="margin:5px 0;">${n.title}</h3><p>${n.content}</p><small>${n.date}</small></div>`
                ).join('');
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            if (student) {
                document.getElementById('s-welcome').textContent = 'Welcome, ' + student.name;
                document.getElementById('s-profile').innerHTML = `
                    <div class="info-grid">
                        <div class="info-item"><label>Name</label><p>${student.name}</p></div>
                        <div class="info-item"><label>Class</label><p>${student.className} - ${student.section}</p></div>
                        <div class="info-item"><label>Roll No</label><p>${student.rollNo}</p></div>
                        <div class="info-item"><label>Admission No</label><p>${student.admissionNo}</p></div>
                        <div class="info-item"><label>Father Name</label><p>${student.fatherName}</p></div>
                        <div class="info-item"><label>Status</label><p><span class="badge badge-success">${student.status}</span></p></div>
                    </div>`;
            }
        });
    </script>
</body>
</html>
